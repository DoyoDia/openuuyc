[package]
name = "openuuyc-launcher"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "../LICENSE"
build = "build.rs"

[[bin]]
name = "OpenUUYC-launcher"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
openuuyc-bootstrap = { path = "../crates/bootstrap", features = ["extract"] }
serde_json = "1.0"
uuid = { version = "1.25.0", features = ["v4"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Security"] }

[build-dependencies]
openuuyc-bootstrap = { path = "../crates/bootstrap" }
serde_json = "1.0"
sha2 = "0.10.9"
zstd = { version = "0.13.3", default-features = false }
embed-resource = "3.0.11"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
