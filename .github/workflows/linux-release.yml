name: Linux release

# Builds the x86_64 binary on Arch (the distribution the AUR packages target)
# and attaches it to the GitHub Release for the pushed tag.
#
# The package in `openuuyc-bin` downloads the `OpenUUYC` asset directly, so the
# asset name and the tag naming scheme (v<version>) are part of the interface:
# keep them in sync with packaging/aur/openuuyc-bin/PKGBUILD.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          # The rolling container image can be behind the keyring it needs to
          # verify its own packages; refresh the keyring first.
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed
          pacman -S --noconfirm --needed \
            base-devel git pkg-config cmake clang nasm rust \
            libva libx11 libxcb libxrandr libxi libxcursor libxfixes \
            libxkbcommon libxkbcommon-x11 wayland libglvnd vulkan-icd-loader \
            dbus alsa-lib openssl fuse3

      - uses: actions/checkout@v7

      # Rust and the Arch packages are baked into the container, but the
      # crates.io index and compiled dependencies are worth caching between
      # runs; a cold build of the media stack takes 20-40 minutes.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: arch-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: arch-release-

      - name: Build
        run: cargo build --release --locked --bin OpenUUYC

      - name: Verify the binary runs
        run: ./target/release/OpenUUYC --version

      - name: Assemble the release archive
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          stage="OpenUUYC-${version}-x86_64-linux"
          mkdir -p "$stage"
          install -Dm755 target/release/OpenUUYC "$stage/OpenUUYC"
          install -Dm755 packaging/linux/openuuyc-launch "$stage/openuuyc-launch"
          install -Dm644 packaging/linux/openuuyc.desktop "$stage/openuuyc.desktop"
          install -Dm644 packaging/linux/openuuyc-gui.service "$stage/openuuyc-gui.service"
          install -Dm644 packaging/linux/60-openuuyc-uinput.rules \
            "$stage/60-openuuyc-uinput.rules"
          install -Dm644 assets/icon-256.png "$stage/icon-256.png"
          install -Dm644 LICENSE "$stage/LICENSE"
          install -Dm644 THIRD_PARTY_NOTICES "$stage/THIRD_PARTY_NOTICES"
          cp -r assets/licenses "$stage/licenses"
          tar --zstd -cf "$stage.tar.zst" "$stage"
          sha256sum "$stage.tar.zst" > "$stage.tar.zst.sha256"
          # The AUR binary package downloads this exact name.
          install -Dm755 target/release/OpenUUYC OpenUUYC
          ls -lh "$stage.tar.zst" OpenUUYC

      - uses: actions/upload-artifact@v7
        with:
          name: openuuyc-arch
          path: |
            OpenUUYC-*-x86_64-linux.tar.zst
            OpenUUYC-*-x86_64-linux.tar.zst.sha256
            OpenUUYC
          if-no-files-found: error

  release:
    needs: arch
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The deb workflow also publishes to this tag; the shared group serializes
    # them so the second run updates the existing release instead of racing it.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: openuuyc-arch
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            OpenUUYC-*-x86_64-linux.tar.zst
            OpenUUYC-*-x86_64-linux.tar.zst.sha256
            OpenUUYC
          # The LICENSE reserves all rights on original material and requires
          # attribution and third-party notices; say so before anyone downloads.
          body: |
            Linux (x86_64) build of the Omarchy/Wayland fork.

            - `OpenUUYC` — the binary. Arch/Omarchy users should prefer the AUR
              package `openuuyc-bin`, which installs this plus the desktop entry,
              icon, systemd unit and uinput udev rule.
            - `OpenUUYC-<version>-x86_64-linux.tar.zst` — binary with those files.

            Host (被控) input on Wayland needs `/dev/uinput` access and an XDG
            ScreenCast portal; see the README's Linux section.

            Non-official, third-party client. Not affiliated with or endorsed by
            NetEase. Read `LICENSE` and `THIRD_PARTY_NOTICES` before
            redistributing.
