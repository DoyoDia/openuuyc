[package]
name = "openuuyc-av1"
version = "0.1.0"
edition = "2021"
publish = false
description = "OpenUUYC AV1 bitstream, low-delay Rust encoding and SIMD decoding"
license-file = "../../../../LICENSE"
build = "build.rs"

[dependencies]
log = "0.4"

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
bytemuck = "1.25.2"
arg_enum_proc_macro = "0.3.4"
bitstream-io = "4.1.0"
cfg-if = "1.0.0"
libc = "0.2"
num-traits = "0.2"
num-derive = "0.4"
pastey = "0.1.0"
v_frame = "0.3.7"
rayon = { package = "maybe-rayon", version = "0.1", default-features = false }
arrayvec = "0.7"
thiserror = "2.0"
itertools = "0.14"
simd_helpers = "0.1"
new_debug_unreachable = "1.0.4"
profiling = { version = "1" }
aligned-vec = "0.6.0"
assert_matches = "1.5.0"
atomig = { version = "0.4.0", features = ["derive"] }
av-data = "0.4.2"
bitflags = "2.4.0"
parking_lot = "0.12.2"
paste = "1.0.14"
raw-cpuid = "11.0.1"
static_assertions = "1.1.0"
strum = { version = "0.27", features = ["derive"] }
to_method = "1.1.0"
zerocopy = { version = "0.7.32", features = ["derive"] }

[build-dependencies]
cc = { version = "1.0", features = ["parallel"], optional = true }
nasm-rs = { version = "0.3", features = ["parallel"], optional = true }

[features]
default = ["asm", "threading", "bitdepth_8", "bitdepth_16"]
asm = ["dep:cc", "dep:nasm-rs"]
threading = ["rayon/threads"]
check_asm = []
tracing = ["profiling/profile-with-tracing"]
bitdepth_8 = []
bitdepth_16 = []

[dev-dependencies]
pretty_assertions = "1.4.0"
interpolate_name = "0.2.4"
nom = "8.0.0"
quickcheck = "1.0"
rand = "0.10"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(nasm_x86_64)", "cfg(fuzzing)"]

